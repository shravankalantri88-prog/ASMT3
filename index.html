<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Shravan - Study Tart</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: radial-gradient(circle at 50% 65%, #e23a2e 0%, #7a2a5a 35%, #3a1f5d 62%, #150f2e 100%);
    color: #fff; min-height: 100vh;
    display: flex; justify-content: center;
  }
  .page { width: 100%; max-width: 1000px; padding: 20px 28px 0 28px; display: flex; flex-direction: column; min-height: 100vh; }
  .top { display: flex; justify-content: space-between; font-size: 12px; letter-spacing: 2px; opacity: 0.9; }
  .hero { display: flex; justify-content: space-between; align-items: center; margin-top: 18px; }
  .left h1 { font-size: 22px; font-weight: 700; }
  .left p { font-size: 12px; opacity: 0.7; margin-top: 2px; }
  .right { display: flex; align-items: center; }
  .right b { font-size: 18px; margin-right: 12px; }
  .cart { width: 42px; height: 42px; border-radius: 50%; background: #ff5a2b; border: none; color: #fff; font-size: 18px; cursor: pointer; box-shadow: 0 0 24px #ff5a2baa; }
  .stage { position: relative; flex: 1; display: flex; justify-content: center; align-items: flex-end; overflow: hidden; min-height: 440px; }
  .tart-wrap { position: relative; width: min(520px, 80vw); aspect-ratio: 1.35 / 1; display: flex; justify-content: center; align-items: flex-end; }
  svg.arc { position: absolute; left: 50%; top: 0; transform: translateX(-50%); width: 130%; height: auto; z-index: 6; pointer-events: none; }
  .pie {
    position: absolute; left: 50%; bottom: -46%; transform: translateX(-50%);
    width: 100%; aspect-ratio: 1 / 1; border-radius: 50%;
    background: radial-gradient(circle at 50% 35%, #2b1a4a, #160f2e);
    border: 10px solid #e6c89a; display: grid; place-items: center;
    box-shadow: 0 20px 60px rgba(0,0,0,0.55); z-index: 1;
  }
  .pie-label { background: rgba(0,0,0,0.6); padding: 8px 24px; border-radius: 99px; font-size: 22px; font-weight: 800; margin-bottom: 38%; z-index: 2; }
  .tab {
    position: absolute; z-index: 5;
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.25);
    color: #fff; font-size: 10px; letter-spacing: 2px;
    padding: 10px 16px; border-radius: 14px;
    cursor: pointer; backdrop-filter: blur(8px);
    transition: 0.25s;
  }
  .tab:hover { background: rgba(255,255,255,0.18); transform: scale(1.06); }
  .tab.on { background: #fff; color: #2b1030; }
  .tab .dotm { display: block; width: 6px; height: 6px; border-radius: 50%; background: currentColor; margin: 5px auto 0 auto; }
  .panel {
    position: absolute; left: 50%; bottom: 62%; transform: translateX(-50%) translateY(12px);
    width: 340px; max-width: 86vw; max-height: 0; overflow: hidden;
    background: #1a1033; border: 1px solid rgba(255,255,255,0.18); border-radius: 16px;
    opacity: 0; transition: all 0.45s cubic-bezier(0.2,1,0.3,1); z-index: 10;
  }
  .panel.open { max-height: 300px; opacity: 1; transform: translateX(-50%) translateY(0); overflow-y: auto; }
  .panel h3 { padding: 12px 16px; font-size: 13px; border-bottom: 1px solid rgba(255,255,255,0.12); display:flex; justify-content:space-between; align-items:center; }
  .panel h3 span.pct { background:rgba(255,255,255,0.15); padding:2px 10px; border-radius:99px; font-size:11px; }
  .panel label { display: flex; gap: 8px; align-items: center; padding: 8px 16px; font-size: 12px; cursor: pointer; }
  .panel label:hover { background: rgba(255,255,255,0.07); }
  .panel input { width: 15px; height: 15px; accent-color: #ff5a2b; }
  .done-line { text-decoration: line-through; opacity: 0.5; }
  .foot { display: flex; justify-content: space-between; font-size: 10px; opacity: 0.5; padding: 10px 0 14px 0; }
</style>
</head>
<body>
<div class="page">
  <div class="top"><div>SHRAVAN</div><div>STUDY • <span id="studyTopMini">0%</span> &nbsp; DAY • <span id="dayTopMini">0%</span></div></div>
  <div class="hero">
    <div class="left"><h1>Study Tart</h1><p id="countLabel">0 of 0 study done</p></div>
    <div class="right"><b id="pctTop">0%</b><button class="cart">/</button></div>
  </div>
  <div class="stage">
    <div class="tart-wrap">
      <svg class="arc" viewBox="0 0 700 360">
        <path d="M 80 340 A 270 270 0 0 1 620 340" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="2"/>
        <path id="prog" d="M 80 340 A 270 270 0 0 1 620 340" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-dasharray="848" stroke-dashoffset="848" style="transition: stroke-dashoffset 0.8s"/>
      </svg>
      <button class="tab" style="left:-10%; top:44%" data-p="p1">WEEK 1<span class="dotm"></span></button>
      <button class="tab" style="left:16%; top:16%" data-p="p2">WEEK 2<span class="dotm"></span></button>
      <button class="tab" style="left:64%; top:16%" data-p="p3">WEEK 3<span class="dotm"></span></button>
      <button class="tab" style="left:92%; top:44%" data-p="p4">DAY <span id="dayBtnPct">0%</span><span class="dotm"></span></button>
      <div class="pie"><div class="pie-label" id="pctPie">0%</div></div>
      <div class="panel" id="p1"><h3>WEEK 1 - Sep 30 to Oct 4 <span class="pct" id="pp1">0%</span></h3><div id="w1"></div></div>
      <div class="panel" id="p2"><h3>WEEK 2 - Oct 5 to Oct 11 <span class="pct" id="pp2">0%</span></h3><div id="w2"></div></div>
      <div class="panel" id="p3"><h3>WEEK 3 - Oct 12 to Oct 19 <span class="pct" id="pp3">0%</span></h3><div id="w3"></div></div>
      <div class="panel" id="p4">
        <h3>How My Day Looks - Today <span class="pct" id="dayPct">0%</span></h3>
        <div id="day"></div>
      </div>
    </div>
  </div>
  <div class="foot"><div>Delivery Contact us</div><div>Privacy</div></div>
</div>

<!-- Firebase for all-users sync -->
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
<script>
  const w1 = ["Sep 30 - Hindi 1 + Electrolysis L2","Oct 1 - SUPW trip Zero","Oct 2 - Calorimetry + Chemistry + History 1","Oct 3 - Hindi catchup + Biology 1","Oct 4 - Metallurgy L1 + Biology 1 + Geo 2"];
  const w2 = ["Oct 5 - Physics 2 + Geo 2 + English 1","Oct 6 - Hindi finish + History 1 + Biology 1","Oct 7 - English 1","Oct 8 - Physics 3 + Geo 3","Oct 9 - Biology 1","Oct 10 - Metallurgy L2 + History 1","Oct 11 - Physics 4 + English 1 + Geo 2"];
  const w3 = ["Oct 12 - Bio 1 + Geo 1 + Comp 1","Oct 13 - History last + Judiciary + English last","Oct 14 - Comp 1 + Revision","Oct 15 - Bio last + Geo 2","Oct 16 - Buffer","Oct 17 - Full revision sweep","Oct 18 - Buffer + papers","Oct 19 - 100% done"];
  const dayArr = ["9:30 - 11:00 Test","11:30 - 12:00 Lunch","12:00 - 3:00 DAIS","3:00 - 4:00 Barber","4:00 - 6:00 Hindi","6:45 - 8:45 Hindi Test","9:30 Sleep"];

  // TODO: paste your Firebase config here
  // const firebaseConfig = { apiKey:"...", authDomain:"...", databaseURL:"...", projectId:"..." };
  // firebase.initializeApp(firebaseConfig);
  let db = null;
  try { if (typeof firebaseConfig !== 'undefined') { firebase.initializeApp(firebaseConfig); db = firebase.database(); } } catch(e){ db = null; }

  const saved = JSON.parse(localStorage.getItem('pie2') || '{}');
  function save(){ localStorage.setItem('pie2', JSON.stringify(saved)); if(db) db.ref('ticks').set(saved); upd(); }
  if(db) db.ref('ticks').on('value', snap => {
    const v = snap.val() || {};
    Object.assign(saved, v);
    localStorage.setItem('pie2', JSON.stringify(saved));
    syncUI(); upd();
  });

  function render(id, arr, pre){
    const box = document.getElementById(id);
    box.innerHTML = '';
    arr.forEach((t,i)=>{
      const l = document.createElement('label');
      const key = pre+i;
      const c = document.createElement('input');
      c.type='checkbox'; c.checked=!!saved[key]; c.dataset.study="1"; c.id='chk-'+key;
      const s = document.createElement('span'); s.textContent=t;
      if(c.checked) s.classList.add('done-line');
      c.onchange=()=>{ saved[key]=c.checked; s.classList.toggle('done-line',c.checked); save(); };
      l.appendChild(c); l.appendChild(s); box.appendChild(l);
    });
  }

  function renderDay(){
    const box = document.getElementById('day');
    box.innerHTML = '';
    dayArr.forEach((t,i)=>{
      const l = document.createElement('label');
      const c = document.createElement('input');
      c.type='checkbox'; c.checked=!!saved['d'+i]; c.dataset.day="1"; c.id='chk-d'+i;
      const s = document.createElement('span'); s.textContent=t;
      if(c.checked) s.classList.add('done-line');
      c.onchange=()=>{ saved['d'+i]=c.checked; s.classList.toggle('done-line',c.checked); save(); };
      l.appendChild(c); l.appendChild(s); box.appendChild(l);
    });
  }

  render('w1',w1,'a'); render('w2',w2,'b'); render('w3',w3,'c'); renderDay();

  function syncUI(){
    document.querySelectorAll('input[type=checkbox]').forEach(c=>{
      const key = c.id.replace('chk-','');
      c.checked = !!saved[key];
      if(c.nextElementSibling) c.nextElementSibling.classList.toggle('done-line', c.checked);
    });
  }

  document.querySelectorAll('.tab').forEach(t=>{
    t.onclick=()=>{
      const p=document.getElementById(t.dataset.p);
      const was=p.classList.contains('open');
      document.querySelectorAll('.panel').forEach(x=>x.classList.remove('open'));
      document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));
      if(!was){ p.classList.add('open'); t.classList.add('on'); }
    };
  });

  function pctOf(selector){
    const boxes=[...document.querySelectorAll(selector)];
    const d=boxes.filter(b=>b.checked).length;
    return {d, n:boxes.length, p:boxes.length?Math.round(d/boxes.length*100):0};
  }
  function upd(){
    const s = pctOf('input[data-study]');
    const d = pctOf('input[data-day]');
    document.getElementById('pctTop').textContent=s.p+'%';
    document.getElementById('pctPie').textContent=s.p+'%';
    document.getElementById('countLabel').textContent=s.d+' of '+s.n+' study done';
    document.getElementById('prog').style.strokeDashoffset=848-(848*s.p/100);
    document.getElementById('dayPct').textContent=d.p+'%';
    document.getElementById('dayBtnPct').textContent=d.p+'%';
    document.getElementById('studyTopMini').textContent=s.p+'%';
    document.getElementById('dayTopMini').textContent=d.p+'%';
    document.getElementById('pp1').textContent=pctOf('#w1 input').p+'%';
    document.getElementById('pp2').textContent=pctOf('#w2 input').p+'%';
    document.getElementById('pp3').textContent=pctOf('#w3 input').p+'%';
  }
  upd();
</script>
</body>
</html>
