<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Shravan - Piemaker Tracker</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: #0e3a32; color: #e8f0ec;
    min-height: 100vh; display: flex; justify-content: center;
  }
  .page { width: 100%; max-width: 1000px; padding: 20px 28px 0 28px; display: flex; flex-direction: column; min-height: 100vh; }
  .top { display: flex; justify-content: space-between; font-size: 12px; letter-spacing: 2px; }
  .hero { display: flex; justify-content: space-between; align-items: center; margin-top: 18px; }
  .left h1 { font-size: 20px; }
  .left p { font-size: 12px; opacity: 0.6; }
  .center { text-align: center; font-size: 10px; letter-spacing: 2px; opacity: 0.7; }
  .sizes { display: flex; gap: 8px; justify-content: center; margin-top: 8px; }
  .sizes span { width: 28px; height: 28px; border-radius: 50%; border: 1px solid rgba(255,255,255,0.3); display: grid; place-items: center; font-size: 11px; }
  .sizes span.on { background: #e8f0ec; color: #0e3a32; }
  .right b { font-size: 16px; margin-right: 10px; }
  .cart { width: 38px; height: 38px; border-radius: 50%; background: #ff5a2b; border: none; color: #fff; font-size: 16px; cursor: pointer; }
  .stage { position: relative; flex: 1; display: flex; justify-content: center; align-items: flex-end; overflow: hidden; min-height: 420px; }
  .tart-wrap { position: relative; width: min(520px, 80vw); aspect-ratio: 1.35 / 1; }
  svg.arc { position: absolute; left: 50%; top: 0; transform: translateX(-50%); width: 130%; height: auto; }
  .pie {
    position: absolute; left: 50%; bottom: -46%; transform: translateX(-50%);
    width: 100%; aspect-ratio: 1 / 1; border-radius: 50%;
    background: radial-gradient(circle at 50% 35%, #1c5a4e, #0e3a32);
    border: 10px solid #e6c89a; display: grid; place-items: center;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
  }
  .pie-inner { text-align: center; margin-bottom: 38%; }
  .pie-books { font-size: 52px; line-height: 1; }
  .pie-label { display: inline-block; margin-top: 8px; background: rgba(0,0,0,0.55); padding: 6px 18px; border-radius: 99px; font-size: 18px; font-weight: 800; }
  .tab { position: absolute; background: none; border: none; color: #9fc0b5; font-size: 10px; letter-spacing: 2px; cursor: pointer; z-index: 5; }
  .tab.on { color: #fff; }
  .tab .dotm { display: block; width: 7px; height: 7px; border-radius: 50%; background: #fff; margin: 5px auto 0 auto; }
  .panel {
    position: absolute; left: 50%; bottom: 62%; transform: translateX(-50%) translateY(12px);
    width: 340px; max-width: 86vw; max-height: 0; overflow: hidden;
    background: #0a2a24; border: 1px solid rgba(255,255,255,0.15); border-radius: 16px;
    opacity: 0; transition: all 0.45s cubic-bezier(0.2,1,0.3,1); z-index: 10;
  }
  .panel.open { max-height: 300px; opacity: 1; transform: translateX(-50%) translateY(0); overflow-y: auto; }
  .panel h3 { padding: 12px 16px; font-size: 13px; border-bottom: 1px solid rgba(255,255,255,0.1); }
  .panel label { display: flex; gap: 8px; align-items: center; padding: 8px 16px; font-size: 12px; cursor: pointer; }
  .panel input { width: 15px; height: 15px; accent-color: #ff5a2b; }
  .done-line { text-decoration: line-through; opacity: 0.5; }
  .routine { position: absolute; left: 0; bottom: 24px; font-size: 11px; line-height: 1.9; }
  .routine h4 { letter-spacing: 2px; font-size: 11px; color: #ffd9a0; margin-bottom: 4px; }
  .foot { display: flex; justify-content: space-between; font-size: 10px; opacity: 0.5; padding: 10px 0 14px 0; }
</style>
</head>
<body>
<div class="page">
  <div class="top"><div>SHRAVAN</div><div>o</div></div>
  <div class="hero">
    <div class="left"><h1>Study Tart</h1><p id="countLabel">0 of 0 done</p></div>
    <div class="center">SELECT WEEK<div class="sizes"><span>W1</span><span class="on">W2</span><span>W3</span></div></div>
    <div class="right"><b id="pctTop">0%</b><button class="cart">/</button></div>
  </div>
  <div class="stage">
    <div class="tart-wrap">
      <svg class="arc" viewBox="0 0 700 360">
        <path d="M 80 340 A 270 270 0 0 1 620 340" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="2"/>
        <path id="prog" d="M 80 340 A 270 270 0 0 1 620 340" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-dasharray="848" stroke-dashoffset="848" style="transition: stroke-dashoffset 0.8s"/>
      </svg>
      <button class="tab" style="left:-8%; top:44%" data-p="p1">WEEK 1<span class="dotm"></span></button>
      <button class="tab" style="left:18%; top:18%" data-p="p2">WEEK 2<span class="dotm"></span></button>
      <button class="tab" style="left:66%; top:18%" data-p="p3">WEEK 3<span class="dotm"></span></button>
      <button class="tab" style="left:94%; top:44%" data-p="p4">DAY<span class="dotm"></span></button>
      <div class="pie"><div class="pie-inner"><div class="pie-books">BOOKS</div><div class="pie-label" id="pctPie">0%</div></div></div>
      <div class="panel" id="p1"><h3>WEEK 1 - Sep 30 to Oct 4</h3><div id="w1"></div></div>
      <div class="panel" id="p2"><h3>WEEK 2 - Oct 5 to Oct 11</h3><div id="w2"></div></div>
      <div class="panel" id="p3"><h3>WEEK 3 - Oct 12 to Oct 19</h3><div id="w3"></div></div>
      <div class="panel" id="p4">
        <h3>How My Day Looks - Tomorrow</h3>
        <div id="day">
          <label><input type="checkbox" data-d /> <span>School + Tuition till 4:30</span></label>
          <label><input type="checkbox" data-d /> <span>Gym 5:00 - 6:00</span></label>
          <label><input type="checkbox" data-d /> <span>Study 6:30 - 9:00</span></label>
          <label><input type="checkbox" data-d /> <span>Free hour 9:00 - 10:00</span></label>
          <label><input type="checkbox" data-d /> <span>Sleep 10:00</span></label>
        </div>
      </div>
    </div>
    <div class="routine">
      <h4>How My Day Looks</h4>
      School + tuition till 4:30<br>Gym 5 - 6<br>Study 6:30 - 9:00<br>Sleep 10:00
    </div>
  </div>
  <div class="foot"><div>Delivery Contact us</div><div>Privacy</div></div>
</div>
<script>
  const w1 = ["Sep 30 - Hindi 1 + Electrolysis L2","Oct 1 - SUPW trip Zero","Oct 2 - Calorimetry + Chemistry + History 1","Oct 3 - Hindi catchup + Biology 1","Oct 4 - Metallurgy L1 + Biology 1 + Geo 2"];
  const w2 = ["Oct 5 - Physics 2 + Geo 2 + English 1","Oct 6 - Hindi finish + History 1 + Biology 1","Oct 7 - English 1","Oct 8 - Physics 3 + Geo 3","Oct 9 - Biology 1","Oct 10 - Metallurgy L2 + History 1","Oct 11 - Physics 4 + English 1 + Geo 2"];
  const w3 = ["Oct 12 - Bio 1 + Geo 1 + Comp 1","Oct 13 - History last + Judiciary + English last","Oct 14 - Comp 1 + Revision","Oct 15 - Bio last + Geo 2","Oct 16 - Buffer","Oct 17 - Full revision sweep","Oct 18 - Buffer + papers","Oct 19 - 100% done"];
  const saved = JSON.parse(localStorage.getItem('pie') || '{}');
  function save(){ localStorage.setItem('pie', JSON.stringify(saved)); upd(); }
  function render(id, arr, pre){
    const box = document.getElementById(id);
    arr.forEach((t,i)=>{
      const l = document.createElement('label');
      const key = pre+i;
      const c = document.createElement('input');
      c.type='checkbox'; c.checked=!!saved[key];
      const s = document.createElement('span'); s.textContent=t;
      if(c.checked) s.classList.add('done-line');
      c.onchange=()=>{ saved[key]=c.checked; s.classList.toggle('done-line',c.checked); save(); };
      l.appendChild(c); l.appendChild(s); box.appendChild(l);
    });
  }
  render('w1',w1,'a'); render('w2',w2,'b'); render('w3',w3,'c');
  document.querySelectorAll('#day input').forEach((c,i)=>{
    c.checked=!!saved['d'+i];
    if(c.checked) c.nextElementSibling.classList.add('done-line');
    c.onchange=()=>{ saved['d'+i]=c.checked; c.nextElementSibling.classList.toggle('done-line',c.checked); save(); };
  });
  document.querySelectorAll('.tab').forEach(t=>{
    t.onclick=()=>{
      const p=document.getElementById(t.dataset.p);
      const was=p.classList.contains('open');
      document.querySelectorAll('.panel').forEach(x=>x.classList.remove('open'));
      document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));
      if(!was){ p.classList.add('open'); t.classList.add('on'); }
    };
  });
  function upd(){
    const boxes=[...document.querySelectorAll('input[type=checkbox]')];
    const d=boxes.filter(b=>b.checked).length;
    const p=boxes.length?Math.round(d/boxes.length*100):0;
    document.getElementById('pctTop').textContent=p+'%';
    document.getElementById('pctPie').textContent=p+'%';
    document.getElementById('countLabel').textContent=d+' of '+boxes.length+' done';
    document.getElementById('prog').style.strokeDashoffset=848-(848*p/100);
  }
  upd();
</script>
</body>
</html>
